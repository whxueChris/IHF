name: Rename trajectory dataset directory

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-trajectory-directory.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename directory and update README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv tanvastouch_finger_trajectory finger_trajectory_dataset
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          text = text.replace("tanvastouch_finger_trajectory", "finger_trajectory_dataset")
          path.write_text(text)
          PY
          git rm .github/workflows/rename-trajectory-directory.yml
          git add README.md
          git commit -m "Rename finger trajectory dataset directory"
          git push
